name: Desktop build

on:
  pull_request:
  workflow_call:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build web application
        working-directory: web
        run: npm ci && npm run build
      - name: Build API sidecar
        run: |
          python -m pip install -r backend/requirements.txt
          python -m PyInstaller backend/forma-api.spec --noconfirm --clean --distpath backend/dist --workpath backend/build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Package desktop application
        working-directory: desktop
        run: npm run make
      - name: Smoke test bundled sidecar lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/scripts/smoke-local-runtime.ps1
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forma-${{ matrix.os }}
          path: desktop/out/make/**
          if-no-files-found: error
